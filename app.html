<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>IT STEP · Розклад</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Keeps the TV awake: a muted, looping, invisible video (fallback for the Wake Lock API). -->
  <video id="keepalive" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1">
    <source src="assets/keepalive.webm" type="video/webm">
    <source src="assets/keepalive.mp4" type="video/mp4">
  </video>

  <!-- The schedule itself. Two frames so a refresh swaps in a fully loaded page with no flash. -->
  <main id="stage" aria-label="Розклад">
    <iframe class="frame" title="Розклад занять" referrerpolicy="no-referrer-when-downgrade" allow="fullscreen" tabindex="-1"></iframe>
    <iframe class="frame" title="Розклад занять" referrerpolicy="no-referrer-when-downgrade" allow="fullscreen" tabindex="-1"></iframe>
  </main>

  <!-- 20:00–08:00: pure black. -->
  <!-- Air raid alerts (pushed by the settings server; not shown at night). -->
  <section id="alert-full" class="alert-full" aria-live="assertive" hidden>
    <div class="alert-inner">
      <div class="alert-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-7 7v6H4v3h16v-3h-1v-6a7 7 0 0 0-7-7Zm-1 4h2v6h-2V7Zm0 7h2v2h-2v-2Z"/></svg>
      </div>
      <h1 id="alert-title" class="alert-title">ПОВІТРЯНА ТРИВОГА</h1>
      <p id="alert-place" class="alert-place"></p>
      <p id="alert-duration" class="alert-duration"></p>
      <p class="alert-go">Пройдіть до укриття</p>
    </div>
  </section>
  <section id="alert-band" class="alert-band" aria-live="polite" hidden>
    <div class="alert-band-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2 1 21h22L12 2Zm-1 7h2v6h-2V9Zm0 8h2v2h-2v-2Z"/></svg>
    </div>
    <div class="alert-band-text">
      <b>ПОПЕРЕДНЯ ЗАГРОЗА<span id="alert-band-place"></span></b>
      <span>Будьте готові пройти до укриття</span>
    </div>
    <div id="alert-band-since" class="alert-band-since"></div>
  </section>
  <div id="alert-clear" class="alert-clear" role="status" hidden>
    <span class="alert-clear-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2Z"/></svg>
    </span>
    <span><b>Відбій тривоги</b><span id="alert-clear-text"></span></span>
  </div>

  <div id="night" aria-hidden="true">
    <!-- Now and then, while black: the animated logo on its own (filled in by app.js). -->
    <div id="night-show" class="night-show"></div>
    <div id="night-hint">
      <img class="night-logo" src="assets/logo.svg" alt="">
      <span id="night-clock"></span>
      <span id="night-text"></span>
    </div>
  </div>
