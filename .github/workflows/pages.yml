name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tests/schedule.test.js

  # Settings server (worker/). Deployed only when the Cloudflare secrets and the admin password
  # are set; without them TVs keep reading settings.json.
  worker:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TV_ADMIN_PASSWORD: ${{ secrets.TV_ADMIN_PASSWORD }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$TV_ADMIN_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or TV_ADMIN_PASSWORD is not set — skipping the settings server."
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Deploy worker
        id: deploy
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          npx -y wrangler@4 deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
          printf '%s' "$TV_ADMIN_PASSWORD" | npx -y wrangler@4 secret put ADMIN_PASSWORD
      - name: Worker URL
        id: url
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOYED: ${{ steps.deploy.outputs.url }}
        run: |
          url="$DEPLOYED"
          if [ -z "$url" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty') || sub=""
            [ -n "$sub" ] && url="https://tv-edvault.$sub.workers.dev"
          fi
          echo "Settings server: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [test, worker]
    # Publish the site even if the worker deploy failed, never with failing tests.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site
        env:
          API_URL: ${{ needs.worker.outputs.url || vars.TV_API_URL }}
        run: |
          mkdir _site
          cp -r *.html *.js *.css settings.json assets .nojekyll _site/
          printf 'window.TV_API_URL = "%s";\n' "$API_URL" > _site/api-url.js
          # TVs compare this with the version they run and swap in the new app (shell.js).
          VERSION="${GITHUB_SHA::12}"
          printf '{"version":"%s"}\n' "$VERSION" > _site/version.json
          # Versioned asset URLs, so a TV never mixes a new page with old scripts from its cache.
          sed -i -E "s/(src|href)=\"([a-z-]+\.(js|css))\"/\1=\"\2?v=$VERSION\"/g" _site/*.html
          # Service worker: its own version (so browsers pick up the new one) and the files a TV
          # needs to start offline, exactly as the pages reference them.
          PRECACHE=$( { printf '%s\n' ./ index.html app.html settings.json; grep -ohE '(src|href)="[^"#]+"' _site/index.html _site/app.html | sed -E 's/^(src|href)="(.*)"$/\2/'; } \
            | grep -vE '^(https?:)?//' | sort -u | jq -R . | jq -sc . )
          sed -i -e "s|^var VERSION = \"dev\";|var VERSION = \"$VERSION\";|" -e "s|^var PRECACHE = \[\];|var PRECACHE = $PRECACHE;|" _site/sw.js
          grep -q "var VERSION = \"$VERSION\"" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
