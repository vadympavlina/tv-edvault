# Settings server for the TV schedule screens (Cloudflare Worker).
# Deployed by .github/workflows/pages.yml; ADMIN_PASSWORD is set there as a Worker secret.
name = "tv-edvault"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Wall clock for the schedule (same as timeZone in config.js).
TIME_ZONE = "Europe/Kyiv"
# Origins allowed to call the admin routes with credentials.
ALLOWED_ORIGINS = "https://tv.edvault.online,https://vadympavlina.github.io,http://localhost:8765,http://localhost:8000"

# Air raid alerts (alerts.in.ua): checked every minute; ALERTS_TOKEN is a Worker secret set by
# the deploy workflow. Our place: Рівненська область (uid 5) when the whole oblast is alerted, or
# alerts for Рівненський район / Рівне itself (titles matched by worker/src/alerts.js).
ALERT_OBLAST_UID = "5"

[triggers]
crons = ["* * * * *"]

# All state lives in one Durable Object (free plan: SQLite-backed).
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
