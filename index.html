<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>IT STEP · Розклад</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <!-- The shell: holds fullscreen and keeps the TV awake, while the app inside (app.html) is
       swapped for a fresh copy after a deploy, every night and on request, without a flash. -->
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      z-index: 2;
    }

    /* A fresh copy loads underneath the visible one and is raised once it is ready. */
    .app.is-pending {
      z-index: 1;
    }

    #keepalive {
      position: fixed;
      left: 0;
      top: 0;
      width: 2px;
      height: 2px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Keeps the TV awake: a muted, looping, invisible video (fallback for the Wake Lock API). -->
  <video id="keepalive" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1">
    <source src="assets/keepalive.webm" type="video/webm">
    <source src="assets/keepalive.mp4" type="video/mp4">
  </video>

  <script src="config.js"></script>
  <script src="schedule.js"></script>
  <script src="shell.js"></script>
  <script src="shell-core.js"></script>
</body>
</html>
